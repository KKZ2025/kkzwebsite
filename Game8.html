<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外卖员送外卖：把字句动作游戏</title>
  <style>
    :root {
      --ink: #1f2937;
      --muted: #667085;
      --line: #d8dee8;
      --paper: #fffdf8;
      --brand: #f97316;
      --brand-dark: #c2410c;
      --blue: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
      --shadow: 0 18px 40px rgba(31, 41, 55, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background: #dff2ff;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      background: #aab3c2;
      box-shadow: none;
    }

    .app {
      width: min(1200px, calc(100vw - 24px));
      height: min(780px, calc(100vh - 24px));
      margin: 12px auto;
      display: block;
      overflow: hidden;
      border: 1px solid rgba(31, 41, 55, 0.14);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
    }

    .side {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 130;
      width: min(390px, calc(100vw - 32px));
      max-height: min(760px, calc(100vh - 28px));
      padding: 34px 17px 22px;
      display: none;
      flex-direction: column;
      gap: 14px;
      overflow: auto;
      background: linear-gradient(#f8fbff, #eef6ff);
      border: 10px solid #111827;
      border-radius: 38px;
      box-shadow: 0 28px 70px rgba(15, 23, 42, 0.28);
      transform: translate(-50%, -50%);
    }

    .side.open { display: flex; }

    .side::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 10px;
      width: 96px;
      height: 16px;
      border-radius: 999px;
      background: #111827;
      transform: translateX(-50%);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: none;
      background: rgba(15, 23, 42, 0.38);
      backdrop-filter: blur(2px);
    }

    .modal-backdrop.show { display: block; }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      font-size: 22px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.18;
      letter-spacing: 0;
    }

    .intro {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .orders {
      display: grid;
      gap: 10px;
    }

    .order {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 10px;
      align-items: center;
      width: 100%;
      padding: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .order.active {
      border-color: #fb923c;
      background: #fff7ed;
    }

    .order.done {
      border-color: #86efac;
      background: #f0fdf4;
      cursor: default;
    }

    .order:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .room {
      font-size: 30px;
      line-height: 1;
      font-weight: 900;
    }

    .order small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .primary-btn,
    .ghost-btn,
    .touch-btn {
      min-height: 38px;
      border-radius: 8px;
      font-weight: 850;
    }

    .primary-btn {
      padding: 0 14px;
      color: #fff;
      background: var(--brand);
      box-shadow: 0 8px 18px rgba(194, 65, 12, 0.22);
    }

    .ghost-btn,
    .touch-btn {
      padding: 0 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
    }

    .dialogue { display: none; }

    .progress {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }

    .step {
      height: 9px;
      border-radius: 99px;
      background: #e5e7eb;
    }

    .step.done { background: var(--green); }
    .step.active { background: var(--brand); }

    .main {
      height: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #e8f4ff;
    }

    .status {
      min-height: 58px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
    }

    .status > div:first-child { display: none; }

    .status-title {
      font-size: 18px;
      line-height: 1.35;
      font-weight: 900;
    }

    .status-hint {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .current-pill {
      flex: 0 0 auto;
      padding: 9px 12px;
      border-radius: 8px;
      color: #fff;
      background: #111827;
      font-weight: 900;
      white-space: nowrap;
    }

    .stage {
      position: relative;
      flex: 0 0 auto;
      width: 100%;
      aspect-ratio: 1672 / 941;
      min-height: 0;
      overflow: hidden;
      background: #dbeafe;
    }

    .scene-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      user-select: none;
      pointer-events: none;
    }

    .game-hud button { pointer-events: auto; }

    .pixel-scene {
      overflow: hidden;
      image-rendering: pixelated;
      background: #87ceeb;
    }

    .art-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      pointer-events: none;
    }

    .pixel-scene,
    .pixel-item {
      position: absolute;
    }

    .pixel-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
      background-size: 18px 18px;
      opacity: 0.35;
    }

    .game-hud {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 16px;
      z-index: 58;
      display: grid;
      grid-template-columns: 150px 1fr 210px;
      align-items: start;
      gap: 16px;
      pointer-events: none;
    }

    .pause-badge,
    .mission-title,
    .coin-row {
      color: #fff7d6;
      font-family: "Courier New", monospace;
      font-weight: 900;
      letter-spacing: 0;
      text-shadow:
        3px 0 #2f241d,
        -3px 0 #2f241d,
        0 3px #2f241d,
        0 -3px #2f241d,
        3px 3px #2f241d;
    }

    .pause-badge {
      width: 130px;
      height: 54px;
      display: grid;
      place-items: center;
      color: #203040;
      text-shadow: none;
      background: linear-gradient(#a8d6ef, #6ea7cf);
      border: 5px solid #203040;
      border-radius: 8px;
      box-shadow: inset -5px -5px 0 rgba(0, 0, 0, 0.16), 5px 5px 0 rgba(15, 23, 42, 0.18);
      font-size: 24px;
    }

    .pause-badge.attention {
      animation: orderPulse 0.9s ease-in-out infinite;
    }

    @keyframes orderPulse {
      0%, 100% { transform: translateY(0); filter: brightness(1); }
      50% { transform: translateY(-2px); filter: brightness(1.18); box-shadow: inset -5px -5px 0 rgba(0, 0, 0, 0.16), 0 0 0 6px rgba(249, 115, 22, 0.34), 5px 5px 0 rgba(15, 23, 42, 0.18); }
    }

    .mission-title {
      padding-top: 12px;
      text-align: center;
      font-size: 28px;
      line-height: 1.15;
    }

    .coin-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding-top: 8px;
    }

    .coin {
      width: 34px;
      height: 46px;
      border: 4px solid #7c3f00;
      border-radius: 50%;
      background: linear-gradient(90deg, #f59e0b 0 18%, #fde047 18% 68%, #f59e0b 68% 100%);
      box-shadow: inset -4px -5px 0 rgba(146, 64, 14, 0.35), 3px 3px 0 rgba(15, 23, 42, 0.18);
    }

    .sky-gradient {
      left: 0;
      top: 0;
      width: 100%;
      height: 330px;
      background: linear-gradient(#45bcef 0%, #a8e3ff 62%, #eef8ff 100%);
    }

    .cloud {
      width: 118px;
      height: 38px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      box-shadow:
        28px -16px 0 10px rgba(255, 255, 255, 0.92),
        62px -6px 0 5px rgba(255, 255, 255, 0.86),
        18px 12px 0 rgba(255, 255, 255, 0.7);
      opacity: 0.85;
    }

    .distant-city {
      left: 0;
      top: 238px;
      width: 100%;
      height: 90px;
      background:
        linear-gradient(90deg, transparent 0 36px, rgba(65, 105, 130, 0.34) 36px 88px, transparent 88px 130px),
        linear-gradient(90deg, rgba(38, 90, 120, 0.22) 0 64px, transparent 64px 108px),
        #b8dfef;
      background-size: 170px 90px, 240px 90px, auto;
      clip-path: polygon(0 44%, 8% 22%, 15% 42%, 23% 18%, 30% 45%, 39% 26%, 50% 48%, 58% 20%, 66% 44%, 74% 26%, 84% 50%, 92% 24%, 100% 42%, 100% 100%, 0 100%);
    }

    .pixel-wall {
      left: 0;
      top: 0;
      width: 100%;
      height: 310px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.18) 1px, transparent 1px),
        linear-gradient(#dbeafe, #c7dded);
      background-size: 56px 56px, auto;
      border-bottom: 8px solid #395a6f;
    }

    .pixel-floor {
      left: 0;
      bottom: 0;
      width: 100%;
      height: 190px;
      background:
        linear-gradient(90deg, rgba(58, 80, 107, 0.18) 1px, transparent 1px),
        linear-gradient(rgba(58, 80, 107, 0.18) 1px, transparent 1px),
        #d6e3d5;
      background-size: 46px 46px;
      border-top: 6px solid #6f8b7c;
    }

    .pixel-road {
      left: 0;
      bottom: 0;
      width: 100%;
      height: 170px;
      background:
        linear-gradient(90deg, transparent 0 42px, rgba(255, 255, 255, 0.55) 42px 76px, transparent 76px 118px),
        #59616f;
      background-size: 118px 12px;
      border-top: 8px solid #334155;
    }

    .sidewalk {
      left: 0;
      top: 318px;
      width: 100%;
      height: 78px;
      background:
        linear-gradient(90deg, rgba(51, 65, 85, 0.18) 2px, transparent 2px),
        #c8d8d8;
      background-size: 64px 64px;
      border-top: 5px solid #f8fafc;
      border-bottom: 6px solid #78909c;
    }

    .fence {
      left: 0;
      top: 285px;
      width: 100%;
      height: 64px;
      background:
        linear-gradient(90deg, transparent 0 32px, #f8fafc 32px 42px, transparent 42px 74px),
        linear-gradient(#f8fafc 0 9px, transparent 9px 29px, #f8fafc 29px 38px, transparent 38px);
      background-size: 74px 64px, 100% 64px;
      filter: drop-shadow(0 4px 0 rgba(51, 65, 85, 0.22));
    }

    .pixel-building {
      left: 535px;
      top: 28px;
      width: 330px;
      height: 385px;
      background:
        repeating-linear-gradient(0deg, transparent 0 34px, rgba(255,255,255,0.18) 34px 39px),
        linear-gradient(90deg, #e7f1f5 0 62%, #ffe084 62% 70%, #2c8ed6 70% 80%, #ef4444 80% 88%, #22c55e 88% 100%);
      border: 7px solid #314155;
      box-shadow: 16px 16px 0 rgba(48, 72, 88, 0.35);
    }

    .pixel-window {
      width: 54px;
      height: 42px;
      background: #c7e7ff;
      border: 5px solid #314155;
      box-shadow: inset 0 -10px 0 rgba(37, 99, 235, 0.18);
    }

    .pixel-door,
    .pixel-room-door {
      background: #a8552a;
      border: 6px solid #2f241d;
      box-shadow: inset 10px 0 0 rgba(255, 255, 255, 0.14);
    }

    .pixel-door {
      left: 650px;
      top: 258px;
      width: 104px;
      height: 150px;
    }

    .entry-awning {
      left: 620px;
      top: 228px;
      width: 160px;
      height: 38px;
      background: #1d4ed8;
      border: 5px solid #1f2937;
      border-radius: 34px 34px 0 0;
      box-shadow: inset 0 -10px 0 rgba(255,255,255,0.2);
    }

    .pixel-door::after,
    .pixel-room-door::after {
      content: "";
      position: absolute;
      right: 12px;
      top: 52%;
      width: 10px;
      height: 10px;
      background: #facc15;
      border: 2px solid #1f2937;
    }

    .pixel-sign {
      display: grid;
      place-items: center;
      color: #111827;
      background: #fef3c7;
      border: 4px solid #314155;
      font-weight: 900;
      text-align: center;
    }

    .pixel-tree {
      width: 70px;
      height: 108px;
    }

    .pixel-tree::before {
      content: "";
      position: absolute;
      left: 18px;
      bottom: 0;
      width: 30px;
      height: 54px;
      background: #8b5a2b;
      border: 4px solid #3f2a18;
    }

    .pixel-tree::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 70px;
      height: 66px;
      background: #35a852;
      border: 5px solid #14532d;
      box-shadow: 12px 16px 0 #22c55e;
    }

    .pixel-elevator {
      left: 370px;
      top: 142px;
      width: 160px;
      height: 210px;
      background: #64748b;
      border: 7px solid #1f2937;
      box-shadow: inset 0 0 0 8px #94a3b8;
    }

    .pixel-elevator::before {
      content: "电梯";
      position: absolute;
      left: 38px;
      top: -43px;
      width: 72px;
      height: 30px;
      display: grid;
      place-items: center;
      color: #f8fafc;
      background: #1f2937;
      border: 4px solid #475569;
      font-weight: 900;
    }

    .pixel-locker {
      left: 600px;
      top: 260px;
      width: 150px;
      height: 110px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: #f59e0b;
      border: 6px solid #78350f;
    }

    .pixel-locker span {
      border: 2px solid #78350f;
      box-shadow: inset 0 -8px 0 rgba(255, 255, 255, 0.18);
    }

    .pixel-room-door {
      top: 158px;
      width: 116px;
      height: 188px;
    }

    .pixel-room-door .number {
      position: absolute;
      left: 18px;
      top: 18px;
      width: 70px;
      height: 36px;
      display: grid;
      place-items: center;
      color: #111827;
      background: #fef3c7;
      border: 4px solid #2f241d;
      font-size: 24px;
      font-weight: 900;
    }

    .pixel-shoe-cabinet {
      left: 230px;
      top: 356px;
      width: 88px;
      height: 66px;
      background: #a16207;
      border: 6px solid #422006;
      box-shadow: inset 0 16px 0 rgba(254, 243, 199, 0.22);
    }

    .pixel-shoe-cabinet::before {
      content: "鞋柜";
      position: absolute;
      left: 10px;
      top: -34px;
      width: 58px;
      height: 26px;
      display: grid;
      place-items: center;
      color: #111827;
      background: #fef3c7;
      border: 3px solid #422006;
      font-weight: 900;
      font-size: 14px;
    }

    .pixel-hook {
      width: 18px;
      height: 18px;
      border: 4px solid #facc15;
      border-left: 0;
      border-top: 0;
      transform: rotate(45deg);
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .obstacle-debug {
      position: absolute;
      display: none;
      border: 2px solid rgba(220, 38, 38, 0.55);
      background: rgba(220, 38, 38, 0.12);
    }

    .hotspot-debug {
      position: absolute;
      display: none;
      border: 2px dashed rgba(37, 99, 235, 0.65);
      background: rgba(37, 99, 235, 0.1);
    }

    .game.debug .obstacle-debug,
    .game.debug .hotspot-debug { display: block; }

    .actor {
      position: absolute;
      left: 13.333%;
      top: 94.862%;
      width: 104px;
      height: 165px;
      z-index: 30;
      transform: translate(-50%, -100%) scaleX(var(--dir, 1));
      transform-origin: 50% 100%;
      pointer-events: none;
      filter: drop-shadow(8px 10px 0 rgba(15, 23, 42, 0.16));
      --sprite-row: 0px;
      background-image: url("assets/generated-art/courier-c-walk-8frame-clean.png");
      background-repeat: no-repeat;
      background-size: 832px 165px;
      background-position: 0 0;
      image-rendering: pixelated;
    }

    .actor.hidden { opacity: 0; }

    .actor > div { display: none; }

    .actor.carrying { --sprite-row: 0px; }

    .actor.walking {
      animation: courierWalk 0.8s steps(8) infinite;
    }

    @keyframes courierWalk {
      from { background-position: 0 0; }
      to { background-position: -832px 0; }
    }

    .carried-bag {
      position: absolute;
      width: 30px;
      height: 34px;
      z-index: 42;
      display: none;
      transform: translate(-50%, -50%);
      border: 3px solid var(--bag-stroke, #92400e);
      border-radius: 8px 8px 7px 7px;
      background: var(--bag-main, #fff7ed);
      box-shadow: inset 0 -11px 0 var(--bag-shadow, rgba(251, 191, 36, 0.48)), 0 6px 10px rgba(15, 23, 42, 0.18);
      pointer-events: none;
      touch-action: none;
    }

    .carried-bag.show { display: block; }

    .carried-bag::before {
      content: "";
      position: absolute;
      left: 8px;
      top: -13px;
      width: 11px;
      height: 12px;
      border: 3px solid var(--bag-stroke, #92400e);
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
    }

    .carried-bag::after,
    .placed-bag::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .carried-bag[data-bag="201"],
    .placed-bag[data-bag="201"] {
      width: 34px;
      height: 36px;
      border-radius: 5px 5px 7px 7px;
      background:
        linear-gradient(90deg, rgba(120, 53, 15, 0.2), transparent 17% 74%, rgba(120, 53, 15, 0.27)),
        linear-gradient(135deg, transparent 0 79%, rgba(120, 53, 15, 0.24) 80% 100%),
        linear-gradient(#eab76c, #c47a2c);
      clip-path: polygon(8% 0, 84% 0, 100% 100%, 0 100%);
    }

    .carried-bag[data-bag="201"]::before,
    .placed-bag[data-bag="201"]::before {
      left: 7px;
      top: -14px;
      width: 17px;
      height: 14px;
      border: 4px solid #8a4b16;
      border-bottom: 0;
      border-radius: 14px 14px 0 0;
    }

    .carried-bag[data-bag="201"]::after,
    .placed-bag[data-bag="201"]::after {
      left: 8px;
      top: 15px;
      width: 16px;
      height: 8px;
      border-radius: 2px;
      background: #fff7ed;
      box-shadow: inset 0 -2px 0 rgba(146, 64, 14, 0.18);
    }

    .carried-bag[data-bag="301"],
    .placed-bag[data-bag="301"] {
      width: 36px;
      height: 32px;
      border-radius: 4px 4px 8px 8px;
      background:
        linear-gradient(180deg, #fff7ed 0 18%, #ef4444 18% 29%, #fff7ed 29% 78%, #dc2626 78%),
        linear-gradient(135deg, transparent 0 78%, rgba(153, 27, 27, 0.17) 79%),
        #fff7ed;
      clip-path: polygon(5% 10%, 82% 0, 100% 100%, 0 100%);
    }

    .carried-bag[data-bag="301"]::before,
    .placed-bag[data-bag="301"]::before {
      left: 17px;
      top: -5px;
      width: 8px;
      height: 30px;
      border: 0;
      border-radius: 5px;
      background: #ef4444;
      box-shadow: 0 1px 0 #991b1b;
    }

    .carried-bag[data-bag="301"]::after,
    .placed-bag[data-bag="301"]::after {
      left: 12px;
      top: 15px;
      width: 12px;
      height: 8px;
      border: 2px solid #ef4444;
      border-radius: 2px;
      background: #fffaf0;
    }

    .carried-bag[data-bag="302"],
    .placed-bag[data-bag="302"] {
      width: 38px;
      height: 34px;
      border-color: #94a3b8;
      border-radius: 46% 46% 38% 38%;
      background:
        radial-gradient(circle at 35% 63%, rgba(226, 232, 240, 0.9) 0 16%, transparent 18%),
        radial-gradient(circle at 62% 61%, rgba(226, 232, 240, 0.82) 0 15%, transparent 17%),
        linear-gradient(90deg, rgba(203, 213, 225, 0.58), rgba(248, 250, 252, 0.95), rgba(203, 213, 225, 0.62));
      box-shadow: inset 0 -8px 0 rgba(148, 163, 184, 0.38), 0 6px 10px rgba(15, 23, 42, 0.18);
    }

    .carried-bag[data-bag="302"]::before,
    .placed-bag[data-bag="302"]::before {
      left: 9px;
      top: -14px;
      width: 13px;
      height: 16px;
      border: 0;
      border-radius: 50% 50% 12px 12px;
      background:
        linear-gradient(45deg, transparent 0 39%, #f8fafc 40% 62%, transparent 63%),
        linear-gradient(-45deg, transparent 0 39%, #e2e8f0 40% 62%, transparent 63%);
      box-shadow: 0 8px 0 -3px #cbd5e1;
    }

    .carried-bag[data-bag="302"]::after,
    .placed-bag[data-bag="302"]::after {
      left: 13px;
      top: -3px;
      width: 6px;
      height: 5px;
      border-radius: 999px;
      background: #cbd5e1;
    }

    .carried-bag[data-bag="402"],
    .placed-bag[data-bag="402"] {
      width: 30px;
      height: 48px;
      border-radius: 6px;
      background:
        linear-gradient(90deg, rgba(120, 53, 15, 0.18), transparent 18% 75%, rgba(120, 53, 15, 0.24)),
        linear-gradient(#fbbf24, #d97706);
      box-shadow: inset 0 -10px 0 rgba(146, 64, 14, 0.24), 0 6px 10px rgba(15, 23, 42, 0.18);
      clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%);
    }

    .carried-bag[data-bag="402"]::before,
    .placed-bag[data-bag="402"]::before {
      left: 7px;
      top: 4px;
      width: 11px;
      height: 6px;
      border: 3px solid #92400e;
      border-radius: 3px;
      background: #fff7ed;
    }

    .carried-bag[data-bag="402"]::after,
    .placed-bag[data-bag="402"]::after {
      left: 7px;
      top: 17px;
      width: 13px;
      height: 20px;
      border: 2px solid #78350f;
      border-radius: 6px 6px 4px 4px;
      background:
        radial-gradient(circle at 35% 86%, #422006 0 2px, transparent 3px),
        radial-gradient(circle at 66% 86%, #422006 0 2px, transparent 3px),
        linear-gradient(#fef3c7 0 28%, #d6a15b 29% 100%);
    }

    .carried-bag.ready {
      cursor: grab;
      pointer-events: auto;
      animation: none;
    }

    .carried-bag.dragging {
      cursor: grabbing;
      animation: none;
      pointer-events: auto;
      box-shadow: inset 0 -11px 0 var(--bag-shadow, rgba(251, 191, 36, 0.48)), 0 12px 18px rgba(15, 23, 42, 0.26);
    }

    @keyframes bagReady {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(249, 115, 22, 0)); }
      50% { filter: drop-shadow(0 0 10px rgba(249, 115, 22, 0.95)); }
    }

    .actor .head {
      position: absolute;
      left: 50%;
      top: 4%;
      width: 34%;
      aspect-ratio: 1;
      transform: translateX(-50%);
      border: 3px solid #263241;
      border-radius: 50%;
      background: #ffd6b2;
      z-index: 6;
    }

    .actor .helmet {
      position: absolute;
      left: 50%;
      top: 0;
      width: 45%;
      height: 18%;
      transform: translateX(-50%);
      border: 3px solid #263241;
      border-radius: 50% 50% 18% 18%;
      background: #f97316;
      z-index: 7;
    }

    .actor .helmet::after {
      content: "";
      position: absolute;
      right: -18%;
      top: 45%;
      width: 32%;
      height: 18%;
      border: 3px solid #263241;
      border-radius: 999px;
      background: #f97316;
    }

    .actor .face {
      position: absolute;
      left: 28%;
      top: 42%;
      width: 8%;
      height: 8%;
      border-radius: 50%;
      background: #263241;
      box-shadow: 28px 0 0 #263241;
    }

    .actor .smile {
      position: absolute;
      left: 41%;
      top: 60%;
      width: 22%;
      height: 12%;
      border-bottom: 3px solid #9a3412;
      border-radius: 0 0 999px 999px;
    }

    .actor .backpack {
      position: absolute;
      right: 10%;
      top: 31%;
      width: 24%;
      height: 33%;
      border: 3px solid #263241;
      border-radius: 12%;
      background: #f97316;
      box-shadow: inset 0 0 0 5px rgba(255, 255, 255, 0.18);
      z-index: 2;
    }

    .actor .torso {
      position: absolute;
      left: 50%;
      top: 27%;
      width: 48%;
      height: 36%;
      transform: translateX(-50%);
      border: 3px solid #263241;
      border-radius: 20% 20% 14% 14%;
      background: linear-gradient(90deg, #f97316 0 48%, #fb923c 48% 100%);
      z-index: 4;
    }

    .actor .strap {
      position: absolute;
      left: 48%;
      top: 25%;
      width: 10%;
      height: 44%;
      transform: rotate(-28deg);
      border-radius: 999px;
      background: #334155;
      z-index: 5;
    }

    .actor .arm {
      position: absolute;
      top: 33%;
      width: 14%;
      height: 33%;
      border: 3px solid #263241;
      border-radius: 999px;
      background: #ffd6b2;
      transform-origin: 50% 12%;
      z-index: 3;
    }

    .actor .arm.left {
      left: 14%;
      transform: rotate(14deg);
    }

    .actor .arm.right {
      right: 12%;
      transform: rotate(-12deg);
    }

    .actor.carrying .arm.right::after {
      content: "";
      position: absolute;
      left: -8px;
      top: 66%;
      width: 38px;
      height: 34px;
      border: 3px solid #92400e;
      border-radius: 12px 12px 8px 8px;
      background: #fff7ed;
      box-shadow: inset 0 -10px 0 rgba(251, 191, 36, 0.42);
    }

    .actor.carrying .arm.right::before {
      content: "";
      position: absolute;
      left: 1px;
      top: 56%;
      width: 19px;
      height: 14px;
      border: 3px solid #92400e;
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
      z-index: 1;
    }

    .actor .hip {
      position: absolute;
      left: 50%;
      top: 62%;
      width: 42%;
      height: 13%;
      transform: translateX(-50%);
      border-radius: 10px;
      background: #1f2937;
      z-index: 4;
    }

    .actor .leg {
      position: absolute;
      top: 69%;
      width: 15%;
      height: 28%;
      border-radius: 999px;
      background: #1f2937;
      transform-origin: 50% 8%;
      z-index: 3;
      box-shadow: 0 0 0 2px rgba(38, 50, 65, 0.7);
    }

    .actor .leg.left { left: 35%; }
    .actor .leg.right { right: 34%; }

    .actor .shoe {
      position: absolute;
      left: -25%;
      bottom: -6%;
      width: 170%;
      height: 24%;
      border: 3px solid #263241;
      border-radius: 999px;
      background: #fb923c;
    }

    .actor.walking .leg.left { animation: legA 0.42s ease-in-out infinite; }
    .actor.walking .leg.right { animation: legB 0.42s ease-in-out infinite; }
    .actor.walking .arm.left { animation: armA 0.42s ease-in-out infinite; }
    .actor.walking .arm.right { animation: armB 0.42s ease-in-out infinite; }
    .actor.walking .torso,
    .actor.walking .head,
    .actor.walking .helmet { animation: bodyBob 0.42s ease-in-out infinite; }
    .actor.placing .arm.right { animation: placeArm 0.65s ease-in-out; }

    @keyframes legA {
      0%, 100% { transform: rotate(24deg); }
      50% { transform: rotate(-26deg); }
    }

    @keyframes legB {
      0%, 100% { transform: rotate(-24deg); }
      50% { transform: rotate(24deg); }
    }

    @keyframes armA {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(24deg); }
    }

    @keyframes armB {
      0%, 100% { transform: rotate(20deg); }
      50% { transform: rotate(-22deg); }
    }

    @keyframes bodyBob {
      0%, 100% { margin-top: 0; }
      50% { margin-top: -4px; }
    }

    @keyframes placeArm {
      0%, 100% { transform: rotate(-12deg); }
      45% { transform: rotate(-72deg) translateY(8px); }
    }

    .placed-bag {
      position: absolute;
      width: 42px;
      height: 36px;
      z-index: 28;
      display: none;
      transform: translate(-50%, -50%);
      border: 3px solid var(--bag-stroke, #92400e);
      border-radius: 12px 12px 8px 8px;
      background: var(--bag-main, #fff7ed);
      box-shadow: inset 0 -12px 0 var(--bag-shadow, rgba(251, 191, 36, 0.42)), 0 8px 14px rgba(15, 23, 42, 0.18);
    }

    .placed-bag.show {
      display: block;
    }

    .placed-bag::before {
      content: "";
      position: absolute;
      left: 10px;
      top: -14px;
      width: 19px;
      height: 15px;
      border: 4px solid var(--bag-stroke, #92400e);
      border-bottom: 0;
      border-radius: 16px 16px 0 0;
    }

    .door-visitor {
      position: absolute;
      width: 96px;
      height: 150px;
      display: none;
      transform: translate(-50%, -100%);
      z-index: 24;
      pointer-events: none;
      filter: drop-shadow(7px 8px 0 rgba(15, 23, 42, 0.22));
    }

    .door-visitor.show {
      display: block;
      animation: visitorAppear 0.34s ease-out both;
    }

    .door-visitor .door-shadow {
      position: absolute;
      left: 5px;
      bottom: 0;
      width: 58px;
      height: 136px;
      border: 4px solid #4a2c1c;
      border-radius: 4px;
      background: linear-gradient(90deg, #2b1b14 0 22%, #5b3522 22% 100%);
      transform: skewY(-2deg);
    }

    .door-visitor .person {
      position: absolute;
      left: 30px;
      bottom: 10px;
      width: 54px;
      height: 118px;
    }

    .door-visitor .head {
      position: absolute;
      left: 15px;
      top: 2px;
      width: 34px;
      height: 38px;
      border: 3px solid #253244;
      border-radius: 48% 48% 46% 46%;
      background: #f2bd91;
    }

    .door-visitor .hair {
      position: absolute;
      left: 11px;
      top: -2px;
      width: 42px;
      height: 18px;
      border: 3px solid #253244;
      border-bottom: 0;
      border-radius: 22px 22px 8px 8px;
      background: #1f2937;
      z-index: 2;
    }

    .door-visitor .eye {
      position: absolute;
      top: 21px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #111827;
      z-index: 3;
    }

    .door-visitor .eye.left { left: 25px; }
    .door-visitor .eye.right { left: 39px; }

    .door-visitor .mouth {
      position: absolute;
      left: 31px;
      top: 32px;
      width: 10px;
      height: 5px;
      border-bottom: 3px solid #7f1d1d;
      border-radius: 0 0 10px 10px;
      z-index: 3;
    }

    .door-visitor .shirt {
      position: absolute;
      left: 7px;
      top: 45px;
      width: 48px;
      height: 66px;
      border: 3px solid #253244;
      border-radius: 14px 14px 8px 8px;
      background: linear-gradient(#60a5fa, #2563eb);
    }

    .door-visitor .hand {
      position: absolute;
      left: 45px;
      top: 70px;
      width: 56px;
      height: 17px;
      border: 3px solid #253244;
      border-radius: 999px;
      background: #f2bd91;
      transform-origin: left center;
      transform: rotate(-7deg);
      animation: handReach 0.7s ease-out both;
      z-index: 4;
    }

    .door-visitor .hand::after {
      content: "";
      position: absolute;
      right: -9px;
      top: -4px;
      width: 17px;
      height: 19px;
      border: 3px solid #253244;
      border-radius: 50%;
      background: #f2bd91;
    }

    @keyframes visitorAppear {
      from { opacity: 0; transform: translate(-58%, -100%); }
      to { opacity: 1; transform: translate(-50%, -100%); }
    }

    @keyframes handReach {
      from { transform: rotate(-7deg) scaleX(0.3); opacity: 0; }
      to { transform: rotate(-7deg) scaleX(1); opacity: 1; }
    }

    .floor-panel {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(430px, 88%);
      padding: 24px;
      display: none;
      transform: translate(-50%, -50%);
      border: 4px solid #64748b;
      border-radius: 14px;
      background: rgba(238, 242, 247, 0.96);
      box-shadow: var(--shadow);
      z-index: 60;
    }

    .floor-panel.show { display: block; }

    .floor-title {
      margin-bottom: 8px;
      text-align: center;
      font-size: 24px;
      font-weight: 900;
    }

    .floor-message {
      min-height: 26px;
      margin-bottom: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
    }

    .floor-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .floor-btn {
      height: 74px;
      border: 2px solid #94a3b8;
      border-radius: 10px;
      color: #0f172a;
      background: #fff;
      font-size: 28px;
      font-weight: 900;
    }

    .floor-btn:hover { border-color: var(--blue); }

    .elevator-doors {
      position: absolute;
      left: 506px;
      top: 174px;
      width: 120px;
      height: 190px;
      z-index: 50;
      opacity: 0;
      display: none;
      pointer-events: none;
      background-repeat: no-repeat;
      background-size: 360px 190px;
      background-position: 0 0;
      image-rendering: pixelated;
    }

    .elevator-doors.active { opacity: 1; }
    .elevator-doors.open {
      animation: elevatorOpen 0.45s steps(2) forwards;
    }

    @keyframes elevatorOpen {
      from { background-position: 0 0; }
      to { background-position: -240px 0; }
    }

    .door-panel {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, rgba(226, 232, 240, 0.94), rgba(148, 163, 184, 0.96));
      border: 2px solid rgba(71, 85, 105, 0.55);
      transition: transform 0.75s ease-in-out;
    }

    .door-panel.left { left: 0; transform-origin: left center; }
    .door-panel.right { right: 0; transform-origin: right center; }
    .elevator-doors.open .door-panel.left { transform: translateX(-85%) scaleX(0.22); }
    .elevator-doors.open .door-panel.right { transform: translateX(85%) scaleX(0.22); }
    .elevator-doors .door-panel { display: none; }

    .interaction {
      position: absolute;
      left: 50%;
      bottom: 18px;
      z-index: 70;
      display: none;
      gap: 10px;
      align-items: center;
      transform: translateX(-50%);
      padding: 10px;
      border: 1px solid rgba(216, 222, 232, 0.95);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.14);
    }

    .interaction.show { display: flex; }

    .interaction span {
      display: none;
      color: var(--muted);
      font-weight: 750;
      white-space: nowrap;
    }

    .toast {
      position: absolute;
      left: 50%;
      top: 18px;
      z-index: 85;
      max-width: min(680px, calc(100% - 36px));
      padding: 12px 16px;
      transform: translateX(-50%);
      border-radius: 999px;
      color: #fff;
      background: #111827;
      font-weight: 850;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 8px);
    }

    .touch-controls {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 65;
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 42px);
      gap: 6px;
      opacity: 0.72;
    }

    .touch-btn[data-dir="up"] { grid-column: 2; grid-row: 1; }
    .touch-btn[data-dir="left"] { grid-column: 1; grid-row: 2; }
    .touch-btn[data-dir="right"] { grid-column: 3; grid-row: 2; }
    .touch-btn[data-dir="down"] { grid-column: 2; grid-row: 3; }

    .finish {
      position: absolute;
      inset: 0;
      z-index: 95;
      display: none;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: rgba(248, 250, 252, 0.96);
    }

    .finish.show { display: grid; }

    .finish-panel {
      width: min(460px, 92%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .finish-panel h2 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .finish-panel p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
    }

    .finish-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .feedback-panel {
      width: min(520px, 94%);
      text-align: left;
    }

    .feedback-panel h2,
    .feedback-panel > p {
      text-align: center;
    }

    .feedback-form {
      display: grid;
      gap: 15px;
    }

    .feedback-field {
      display: grid;
      gap: 7px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 800;
    }

    .feedback-field input,
    .feedback-field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px 12px;
      color: var(--ink);
      background: #fff;
      font: inherit;
      font-weight: 500;
    }

    .feedback-field textarea {
      min-height: 118px;
      resize: vertical;
      line-height: 1.5;
    }

    .feedback-field input:focus,
    .feedback-field textarea:focus {
      outline: 3px solid rgba(249, 115, 22, 0.2);
      border-color: var(--brand);
    }

    .rating-options {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .rating-options label {
      display: grid;
      place-items: center;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff7ed;
      cursor: pointer;
    }

    .rating-options label:has(input:checked) {
      color: #fff;
      border-color: var(--brand);
      background: var(--brand);
    }

    .rating-options input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .feedback-note {
      margin: -3px 0 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.45;
    }

    .feedback-error {
      display: none;
      margin: 0;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 750;
    }

    .feedback-error.show { display: block; }

    @media (max-width: 900px) {
      body { overflow: auto; }

      .app {
        height: auto;
        min-height: calc(100vh - 20px);
        margin: 10px auto;
      }

      .main { min-height: 650px; }
      .actor { width: 104px; height: 165px; }
      .touch-controls { right: 12px; bottom: 12px; }
      .interaction { max-width: calc(100% - 24px); }
    }
  </style>
</head>
<body>
  <div class="modal-backdrop" id="order-backdrop"></div>
  <main class="app">
    <aside class="side" id="order-modal" aria-label="订单弹窗">
      <section class="modal-head">
        <div>
          <h1>外卖员送外卖</h1>
          <p class="intro">用方向键或 WASD 控制外卖员。靠近入口、电梯和门口时会出现按钮；根据顾客要求拖动手里的外卖。</p>
        </div>
        <button class="close-btn" id="order-close" type="button" aria-label="关闭订单">×</button>
      </section>

      <div class="progress" aria-label="配送进度">
        <div class="step active" data-step="call"></div>
        <div class="step" data-step="travel"></div>
        <div class="step" data-step="deliver"></div>
      </div>

      <section class="card">
        <h2>订单</h2>
        <div class="orders" id="orders"></div>
      </section>

    </aside>

    <section class="main">
      <header class="status">
        <div>
          <div class="status-title" id="status-title">请先查看订单</div>
          <div class="status-hint" id="status-hint">点击左上角订单按钮，选择订单后出发。</div>
        </div>
        <div class="current-pill" id="current-pill">当前订单：无</div>
      </header>

      <div class="stage game" id="stage">
        <div class="scene-bg pixel-scene" id="scene-art" aria-hidden="true"></div>
        <div class="game-hud">
          <button class="pause-badge attention" id="order-toggle" type="button">订单</button>
          <div class="mission-title" id="mission-title">Delivery<br>Quest</div>
          <div class="coin-row">
            <span class="coin"></span>
            <span class="coin"></span>
            <span class="coin"></span>
            <span class="coin"></span>
          </div>
        </div>
        <div class="overlay" id="debug-layer" aria-hidden="true"></div>

        <div class="actor" id="actor" aria-hidden="true">
          <div class="backpack"></div>
          <div class="helmet"></div>
          <div class="head"><div class="face"></div><div class="smile"></div></div>
          <div class="strap"></div>
          <div class="torso"></div>
          <div class="arm left"></div>
          <div class="arm right"></div>
          <div class="hip"></div>
          <div class="leg left"><div class="shoe"></div></div>
          <div class="leg right"><div class="shoe"></div></div>
        </div>

        <div class="carried-bag" id="carried-bag" aria-label="手中的外卖"></div>
        <div class="placed-bag" id="placed-bag" aria-hidden="true"></div>
        <div class="door-visitor" id="door-visitor" aria-hidden="true">
          <div class="door-shadow"></div>
          <div class="person">
            <div class="hair"></div>
            <div class="head"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
            <div class="shirt"></div>
            <div class="hand"></div>
          </div>
        </div>

        <div class="elevator-doors" id="elevator-doors" aria-hidden="true">
          <div class="door-panel left"></div>
          <div class="door-panel right"></div>
        </div>

        <section class="floor-panel" id="floor-panel" aria-label="电梯楼层">
          <div class="floor-title">电梯</div>
          <div class="floor-message" id="floor-message">请选择楼层。</div>
          <div class="floor-buttons">
            <button class="floor-btn" data-floor="4" type="button">4</button>

      };

      const hallFloor = sceneId.startsWith("hall") ? sceneId.replace("hall", "") : "";

        hall2: [{ room: "201", left: 170 }, { room: "202", left: 610 }],
        hall3: [{ room: "301", left: 160 }, { room: "302", left: 615 }],

      const windows = `

          <span></span><span></span><span></span>

      `;

        sceneArt.innerHTML = `

        return;
      }

      if (sceneId === "lobby") {
        sceneArt.innerHTML = `
          <img class="art-bg" src="${state.elevatorOpenScene ? art.lobbyOpen : art.lobby}" alt="">
        `;
        return;
      }

      if (sceneId === "hall2" || sceneId === "hall3" || sceneId === "hall4") {
        let hallImage = art[sceneId];
        if (sceneId === "hall2" && state.door201Open && !orders[201].completed) hallImage = art.hall2Open;
        if (state.elevatorOpenScene && sceneId === "hall2") hallImage = art.hall2ElevatorOpen;
        if (state.elevatorOpenScene && sceneId === "hall3") hallImage = art.hall3Open;
        if (state.elevatorOpenScene && sceneId === "hall4") hallImage = art.hall4Open;

          <img class="art-bg" src="${hallImage}" alt="">
        `;
        return;
      }

      const doors = hallDoors[sceneId].map(door => `
        <div class="pixel-item pixel-room-door" style="left:${door.left}px;">

          ${door.room === "402" ? '<div class="pixel-item pixel-hook" style="left:74px;top:96px;"></div>' : ""}

    function updateActorPosition() {
      actor.style.left = `${scaleX(state.player.x)}px`;

    function updateCarriedBagPosition() {
      if (!state.carrying || actor.classList.contains("hidden")) {
        carriedBag.classList.remove("show", "ready");
        return;
      }
      if (state.bagDragging) return;
      const side = state.player.dir >= 0 ? 1 : -1;
      applyBagStyle(carriedBag, state.currentOrder);
      carriedBag.style.left = `${scaleX(state.player.x + side * 28)}px`;
      carriedBag.style.top = `${scaleY(state.player.y - 42)}px`;
      carriedBag.classList.add("show");
      carriedBag.classList.toggle("ready", Boolean(getActiveDropConfig()) && !state.busy);
    }

    function gameLoop(now) {
      const dt = Math.min(0.04, (now - state.lastFrame) / 1000);
      state.lastFrame = now;
      if (!state.busy && !floorPanel.classList.contains("show")) movePlayer(dt);
      requestAnimationFrame(gameLoop);
    }

    function movePlayer(dt) {
      let dx = 0;
      let dy = 0;
      if (state.keys.has("ArrowLeft") || state.keys.has("a")) dx -= 1;
      if (state.keys.has("ArrowRight") || state.keys.has("d")) dx += 1;
      if (state.keys.has("ArrowUp") || state.keys.has("w")) dy -= 1;
      if (state.keys.has("ArrowDown") || state.keys.has("s")) dy += 1;
      if (dx === 0 && dy === 0) {
        actor.classList.remove("walking");
        return;
      }

      const length = Math.hypot(dx, dy) || 1;
      dx /= length;
      dy /= length;
      if (dx < 0) state.player.dir = -1;
      if (dx > 0) state.player.dir = 1;

      const next = {
        x: state.player.x + dx * state.player.speed * dt,
        y: state.player.y + dy * state.player.speed * dt
      };

      if (canStandAt(next.x, next.y)) {
        state.player.x = next.x;
        state.player.y = next.y;
      } else if (canStandAt(next.x, state.player.y)) {
        state.player.x = next.x;
      } else if (canStandAt(state.player.x, next.y)) {
        state.player.y = next.y;
      }

      actor.classList.add("walking");
      updateActorPosition();
      evaluateInteractions();
    }

    function canStandAt(x, y) {
      const scene = sceneData[state.sceneId];
      const foot = { x: x - 18, y: y - 12, w: 36, h: 24 };
      if (!rectContains(scene.walk, foot)) return false;
      return !scene.obstacles.some(obstacle => rectsIntersect(foot, obstacle));
    }

    function evaluateInteractions() {
      if (state.busy) return;
      const scene = sceneData[state.sceneId];
      const footPoint = { x: state.player.x, y: state.player.y };
      const found = scene.interactions.find(item => {
        if (item.requiresOrder && !state.currentOrder) return false;
        if (item.order && state.currentOrder !== item.order) return false;
        if (item.id === "knock201Door" && state.door201Open) return false;
        return pointInInteraction(footPoint, item);
      });

      state.activeInteraction = found || null;
      if (!found) {
        updateCarriedBagPosition();
        interaction.classList.remove("show");
        return;
      }

      updateCarriedBagPosition();
      interactionLabel.textContent = found.label;
      interactionBtn.textContent = found.label;
      interaction.classList.add("show");
    }

    async function handleInteraction() {
      const item = state.activeInteraction;
      if (!item || state.busy) return;
      const handlers = {
        enterBuilding,
        enterElevator,
        exitBuilding,
        knock201Door,
        deliver301
      };
      await handlers[item.id]();
      evaluateInteractions();
    }

    async function enterBuilding() {
      state.busy = true;
      interaction.classList.remove("show");
      updateStatus("进入大楼", "外卖员走进一楼大厅。");
      await autoWalkTo(755, 382, 760);
      actor.classList.add("hidden");
      await wait(180);
      setScene("lobby");
      showToast("一楼大厅到了。");
      state.busy = false;
    }

    async function knock201Door() {
      if (state.currentOrder !== "201" || !state.carrying) {
        showToast("这里需要 201 的外卖。");
        return;
      }

      state.busy = true;
      interaction.classList.remove("show");
      updateStatus("201 门口", "外卖员敲了敲门。");
      await playKnockSound();
      await wait(260);
      state.door201Open = true;
      renderPixelScene(state.sceneId);
      updateDoorVisitor();
      updateStatus("201 门开了", "男生伸出手，请把外卖递给他。");
      showToast("把外卖拖到男生手上。");
      await playAudioFile("assets/audio/door-201-hand-request.mp3");
      state.busy = false;
      updateCarriedBagPosition();
      evaluateInteractions();
    }

    async function exitBuilding() {
      state.busy = true;
      interaction.classList.remove("show");
      updateStatus("走出大楼", "外卖员从一楼大厅走到楼外。");
      await autoWalkTo(120, 438, 620);
      actor.classList.add("hidden");
      await wait(160);
      setScene("outside");
      setPlayer(760, 430);
      showToast("已经回到楼外。");
      state.busy = false;
    }

    async function enterElevator() {
      state.busy = true;
      interaction.classList.remove("show");
      updateStatus("进入电梯", "电梯门打开，外卖员进入电梯。");
      state.elevatorOpenScene = true;
      renderPixelScene(state.sceneId);
      await wait(420);
      await autoWalkIntoElevator(550, 340, 620);
      actor.classList.add("hidden");
      await wait(200);
      floorPanel.classList.add("show");
      floorMessage.textContent = "请选择楼层。";
      state.busy = false;
    }

    async function chooseFloor(floor) {
      if (state.busy) return;
      state.busy = true;
      floorMessage.textContent = `电梯正在前往 ${floor} 楼...`;
      await wait(750);
      await wait(500);
      floorMessage.textContent = `${floor} 楼到了。`;
      const nextScene = floor === 1 ? "lobby" : `hall${floor}`;
      setScene(nextScene);
      state.elevatorOpenScene = true;
      renderPixelScene(nextScene);
      await wait(500);
      state.elevatorOpenScene = false;
      renderPixelScene(nextScene);
      if (floor === 3) {
        missionTitle.innerHTML = "Floor<br>3";
        updateStatus("3 楼走廊", getFloorHint(floor));
      } else if (floor === 1) {
        updateStatus("一楼大厅", state.currentOrder ? `订单 ${state.currentOrder} 在 ${orders[state.currentOrder].floor} 楼，可以回到电梯选择楼层。` : "可以从左边门口出楼，也可以进入电梯。");
      } else {
        updateStatus(`${floor} 楼走廊`, getFloorHint(floor));
      }
      state.busy = false;
    }

    async function deliver301() {
      await deliverCurrentOrder(getDeliveryConfig("301"));
    }

    async function deliverCurrentOrder(config) {
      if (!config || state.currentOrder !== config.room || !state.carrying) {
        showToast("现在的外卖不能放在这里。");
        return;
      }

      const order = orders[config.room];
      state.busy = true;
      interaction.classList.remove("show");
      state.bagReady = false;
      updateStatus("正在配送", config.progressText);
      actor.classList.remove("carrying");
      applyBagStyle(placedBag, config.room);
      positionPlacedBag(config.point);
      placedBag.classList.add("show");
      carriedBag.classList.remove("show", "ready", "dragging");
      await wait(280);

      order.completed = true;
      order.status = "已完成";
      state.carrying = false;
      state.currentOrder = null;
      if (config.room === "201") updateDoorVisitor();
      currentPill.textContent = "当前订单：无";
      updateStatus(`${config.room} 已完成`, config.doneText);
      missionTitle.innerHTML = "Quest<br>Clear";
      updateSteps("deliver");
      renderOrders();
      showToast(`${config.room}配送成功！`);
      speak(`${config.room}配送成功。`);
      await wait(700);

      if (!areAllPlayableOrdersCompleted()) {
        const remaining = getRemainingPlayableOrders();
        missionTitle.innerHTML = "Next<br>Order";
        updateSteps("call");
        updateStatus("继续配送", `还剩 ${remaining.length} 个订单，点击左上角订单按钮选择下一单。`);
        orderToggle.classList.add("attention");
        state.busy = false;
        evaluateInteractions();
        return;
      }

      const finishTitle = finishScreen.querySelector("h2");
      const finishText = finishScreen.querySelector("p");
      finishTitle.textContent = "全部配送成功！";
      finishText.textContent = "所有订单都已经送达，今天的配送任务完成了。";
      finishScreen.classList.add("show");
      state.busy = false;
      window.setTimeout(openFeedback, 450);
    }

    function getRemainingPlayableOrders() {
      return Object.values(orders).filter(order => order.enabled && !order.completed);
    }

    function areAllPlayableOrdersCompleted() {
      return getRemainingPlayableOrders().length === 0;
    }

    async function autoWalkTo(x, y, ms) {
      const startX = state.player.x;
      const startY = state.player.y;
      const startTime = performance.now();
      actor.classList.add("walking");
      state.player.dir = x < startX ? -1 : 1;
      while (performance.now() - startTime < ms) {
        const t = (performance.now() - startTime) / ms;
        state.player.x = startX + (x - startX) * t;
        state.player.y = startY + (y - startY) * t;
        updateActorPosition();
        await wait(16);
      }
      state.player.x = x;
      state.player.y = y;
      updateActorPosition();
      actor.classList.remove("walking");
    }

    async function autoWalkIntoElevator(x, y, ms) {
      const startX = state.player.x;
      const startY = state.player.y;
      const startTime = performance.now();
      actor.classList.add("walking");
      state.player.dir = 1;
      while (performance.now() - startTime < ms) {
        const t = (performance.now() - startTime) / ms;
        const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        state.player.x = startX + (x - startX) * eased;
        state.player.y = startY + (y - startY) * eased;
        updateActorPosition();
        await wait(16);
      }
      state.player.x = x;
      state.player.y = y;
      updateActorPosition();
      actor.classList.remove("walking");
    }

    function positionPlacedBag(point) {
      const actual = worldPoint(point);
      placedBag.style.left = `${actual.x}px`;
      placedBag.style.top = `${actual.y}px`;
    }

    function applyBagStyle(element, room) {
      const style = BAG_STYLES[room] || BAG_STYLES[201];
      element.dataset.bag = room || "201";
      element.style.setProperty("--bag-main", style.main);
      element.style.setProperty("--bag-stroke", style.stroke);
      element.style.setProperty("--bag-shadow", style.shadow);
    }

    function positionDoorVisitor(point) {
      const actual = worldPoint(point);
      doorVisitor.style.left = `${actual.x}px`;
      doorVisitor.style.top = `${actual.y}px`;
    }

    function updateDoorVisitor() {
      doorVisitor.classList.remove("show");
    }

    function startBagDrag(event) {
      if (state.busy || !state.carrying || !getActiveDropConfig()) return;
      event.preventDefault();
      const rect = carriedBag.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      state.bagDragging = true;
      state.bagDragOffsetX = event.clientX - rect.left;
      state.bagDragOffsetY = event.clientY - rect.top;
      carriedBag.classList.add("dragging");
      carriedBag.style.left = `${rect.left - stageRect.left + rect.width / 2}px`;
      carriedBag.style.top = `${rect.top - stageRect.top + rect.height / 2}px`;
      carriedBag.setPointerCapture(event.pointerId);
    }

    function moveBagDrag(event) {
      if (!state.bagDragging) return;
      const stageRect = stage.getBoundingClientRect();
      const x = event.clientX - stageRect.left - state.bagDragOffsetX + carriedBag.offsetWidth / 2;
      const y = event.clientY - stageRect.top - state.bagDragOffsetY + carriedBag.offsetHeight / 2;
      carriedBag.style.left = `${Math.max(18, Math.min(stageRect.width - 18, x))}px`;
      carriedBag.style.top = `${Math.max(24, Math.min(stageRect.height - 24, y))}px`;
    }

    async function endBagDrag(event) {
      if (!state.bagDragging) return;
      carriedBag.releasePointerCapture(event.pointerId);
      state.bagDragging = false;
      carriedBag.classList.remove("dragging");

      const config = getActiveDropConfig();
      if (isCarriedBagOnDropTarget(config)) {
        await deliverCurrentOrder(config);
        return;
      }

      showToast(config ? config.errorText : "位置不对。请先确认顾客要求。");
      updateCarriedBagPosition();
    }

    function isCarriedBagOnShoeCabinet() {
      return isCarriedBagOnDropTarget(getDeliveryConfig("301"));
    }

    function isCarriedBagOnDropTarget(config) {
      if (!config) return false;
      const scene = sceneData.hall3;
      const bagRect = carriedBag.getBoundingClientRect();
      const stageRect = stage.getBoundingClientRect();
      const center = {
        x: bagRect.left - stageRect.left + bagRect.width / 2,
        y: bagRect.top - stageRect.top + bagRect.height / 2
      };
      return pointInRect(center, worldRect(config.rect));
    }

    function getDeliveryConfig(room) {
      const configs = {
        301: {
          room: "301",
          sceneId: "hall3",
          rect: sceneData.hall3.shoeCabinetDrop,
          point: sceneData.hall3.bagTarget,
          progressText: "外卖员把外卖放在鞋柜上。",
          doneText: "301配送成功：外卖已经放在鞋柜上。",
          finishText: "外卖员把外卖放在 301 门口的鞋柜上了。",
          errorText: "位置不对。301 顾客说要放在鞋柜上。"
        },
        201: {
          room: "201",
          sceneId: "hall2",
          rect: sceneData.hall2.customerHandDrop,
          point: sceneData.hall2.bagTarget,
          progressText: "外卖员把外卖递到男生手上。",
          doneText: "201配送成功：外卖已经递给顾客。",
          finishText: "外卖员在 201 门口敲门后，把外卖递给顾客了。",
          errorText: "位置不对。201 顾客说要递到他的手上。"
        },
        302: {
          room: "302",
          sceneId: "outside",
          rect: sceneData.outside.lockerDrop,
          point: sceneData.outside.bagTarget,
          progressText: "外卖员把外卖放进外卖柜。",
          doneText: "302配送成功：外卖已经放进外卖柜。",
          finishText: "外卖员把外卖放进楼外的外卖柜里了。",
          errorText: "位置不对。302 顾客说要放进外卖柜。"
        },
        402: {
          room: "402",
          sceneId: "hall4",
          rect: sceneData.hall4.doorHandleDrop,
          point: sceneData.hall4.bagTarget,
          progressText: "外卖员把外卖挂在门把手上。",
          doneText: "402配送成功：外卖已经挂在门把手上。",
          finishText: "外卖员把外卖挂在 402 门口的门把手上了。",
          errorText: "位置不对。402 顾客说要挂在门把手上。"
        }
      };
      return configs[room] || null;
    }

    function getActiveDropConfig() {
      const config = getDeliveryConfig(state.currentOrder);
      if (config && config.room === "201" && !state.door201Open) return null;
      return config && config.sceneId === state.sceneId ? config : null;
    }

    function getCompletedPlacementForScene(sceneId) {
      const completed = Object.values(orders)
        .map(order => getDeliveryConfig(order.room))
        .find(config => config && config.sceneId === sceneId && orders[config.room].completed);
      return completed ? { room: completed.room, point: completed.point } : null;
    }

    function getFloorHint(floor) {
      if (!state.currentOrder) return "靠近电梯可以重新选择楼层。";
      const order = orders[state.currentOrder];
      if (floor !== order.floor) return `订单 ${order.room} 在 ${order.floor} 楼，可以靠近电梯重新选择。`;
      if (order.room === "201") return state.door201Open ? "把外卖拖到男生伸出的手上。" : "走到 201 门口，点击“敲门”。";
      if (order.room === "301") return "找到 301 门口的鞋柜，想一想外卖应该放在哪里。";
      if (order.room === "302") return "顾客不在家，需要回到楼外，把外卖放进外卖柜。";
      if (order.room === "402") return "找到 402 的门把手，把外卖挂在门上。";
      return "根据电话里的要求完成配送。";
    }

    function updateStatus(title, hint) {
      statusTitle.textContent = title;
      statusHint.textContent = hint;
    }

    function updateSteps(activeStep) {
      const order = ["call", "travel", "deliver"];
      const activeIndex = order.indexOf(activeStep);
      document.querySelectorAll(".step").forEach(step => {
        const index = order.indexOf(step.dataset.step);
        step.classList.toggle("done", index < activeIndex || (activeStep === "deliver" && index <= activeIndex));
        step.classList.toggle("active", index === activeIndex && activeStep !== "deliver");
      });
    }

    function renderDebug(scene) {
      debugLayer.innerHTML = "";
      scene.obstacles.forEach(rect => {
      const el = document.createElement("div");
      el.className = "obstacle-debug";
        placeRect(el, worldRect(rect));
        debugLayer.appendChild(el);
      });
      scene.interactions.forEach(item => {
        getInteractionRects(item).forEach(rect => {
          const el = document.createElement("div");
          el.className = "hotspot-debug";
          placeRect(el, worldRect(rect));
          debugLayer.appendChild(el);
        });
      });
    }

    function placeRect(el, rect) {
      el.style.left = `${rect.x}px`;
      el.style.top = `${rect.y}px`;
      el.style.width = `${rect.w}px`;
      el.style.height = `${rect.h}px`;
    }

    function rectContains(container, rect) {
      return rect.x >= container.x &&
        rect.y >= container.y &&
        rect.x + rect.w <= container.x + container.w &&
        rect.y + rect.h <= container.y + container.h;
    }

    function rectsIntersect(a, b) {
      return a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y;
    }

    function pointInRect(point, rect) {
      return point.x >= rect.x &&
        point.x <= rect.x + rect.w &&
        point.y >= rect.y &&
        point.y <= rect.y + rect.h;
    }

    function getInteractionRects(item) {
      return item.rects || (item.rect ? [item.rect] : []);
    }

    function pointInInteraction(point, item) {
      return getInteractionRects(item).some(rect => pointInRect(point, rect));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1700);
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-CN";
      window.speechSynthesis.speak(utterance);
    }

    function playAudioFile(src) {
      return new Promise(resolve => {
        const audio = new Audio(src);
        audio.onended = resolve;
        audio.onerror = resolve;
        audio.play().catch(resolve);
      });
    }

    function playKnockSound() {
      return playAudioFile("assets/audio/knock-door.mp3");
    }

    async function speakPhoneDialogue(room) {
      const customerAudio = {
        "201": "assets/audio/phone-302-B-customer-final.mp3",
        "301": "assets/audio/phone-301-B-customer-final.mp3",
        "302": "assets/audio/phone-201-B-customer-final.mp3",
        "402": "assets/audio/phone-402-B-customer-final.mp3"
      };
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      await playAudioFile("assets/audio/phone-301-A-courier-final.wav");
      await wait(1000);
      await playAudioFile(customerAudio[room] || customerAudio["301"]);
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function openFeedback() {
      feedbackScreen.classList.add("show");
      window.setTimeout(() => feedbackComments.focus(), 0);
    }

    function closeFeedback() {
      feedbackScreen.classList.remove("show");
    }

    function submitFeedback(event) {
      event.preventDefault();
      feedbackError.classList.remove("show");

      if (!FEEDBACK_REPOSITORY || !/^[^/\s]+\/[^/\s]+$/.test(FEEDBACK_REPOSITORY)) {
        feedbackError.textContent = "反馈仓库还没有配置，请联系老师。";
        feedbackError.classList.add("show");
        return;
      }

      const formData = new FormData(feedbackForm);
      const rating = formData.get("rating");
      const comments = String(formData.get("comments") || "").trim();
      const studentName = String(formData.get("name") || "").trim() || "匿名学生";
      if (!rating || !comments) {
        feedbackError.textContent = "请选择评分并写下评价。";
        feedbackError.classList.add("show");
        return;
      }

      const title = `[学生反馈] 外卖配送练习 · ${rating}/5`;
      const body = [
        "## 外卖配送练习反馈",
        "",
        `- 评分：${rating}/5`,
        `- 学生：${studentName}`,
        `- 提交时间：${new Date().toLocaleString("zh-CN")}`,
        "",
        "### 评价",
        comments,
        "",
        "---",
        "此反馈由外卖配送小游戏自动生成。"
      ].join("\n");
      const issueUrl = new URL(`https://github.com/${FEEDBACK_REPOSITORY}/issues/new`);
      issueUrl.searchParams.set("title", title);
      issueUrl.searchParams.set("body", body);
      issueUrl.searchParams.set("labels", "student-feedback");
      window.open(issueUrl.toString(), "_blank", "noopener,noreferrer");
      localStorage.setItem("delivery-feedback-drafted", "true");
      closeFeedback();
    }

    document.addEventListener("keydown", event => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "a", "d", "w", "s"].includes(key)) {
        event.preventDefault();
        state.keys.add(key);
      }
      if (key === "Tab") stage.classList.toggle("debug");
    });

    document.addEventListener("keyup", event => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      state.keys.delete(key);
    });

    document.querySelectorAll(".touch-btn").forEach(button => {
      const map = { left: "ArrowLeft", right: "ArrowRight", up: "ArrowUp", down: "ArrowDown" };
      const key = map[button.dataset.dir];
      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        state.keys.add(key);
      });
      button.addEventListener("pointerup", () => state.keys.delete(key));
      button.addEventListener("pointercancel", () => state.keys.delete(key));
      button.addEventListener("pointerleave", () => state.keys.delete(key));
    });

    ordersEl.addEventListener("click", event => {
      const orderCard = event.target.closest("[data-order]");
      if (orderCard) callOrder(orderCard.dataset.order);
    });

    ordersEl.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      const orderCard = event.target.closest("[data-order]");
      if (!orderCard) return;
      event.preventDefault();
      callOrder(orderCard.dataset.order);
    });

    orderToggle.addEventListener("click", openOrderModal);
    orderClose.addEventListener("click", closeOrderModal);
    orderBackdrop.addEventListener("click", closeOrderModal);
    interactionBtn.addEventListener("click", handleInteraction);
    leaveFeedbackBtn.addEventListener("click", openFeedback);
    feedbackCancel.addEventListener("click", closeFeedback);
    feedbackForm.addEventListener("submit", submitFeedback);
    carriedBag.addEventListener("pointerdown", startBagDrag);
    carriedBag.addEventListener("pointermove", moveBagDrag);
    carriedBag.addEventListener("pointerup", endBagDrag);
    carriedBag.addEventListener("pointercancel", event => {
      if (!state.bagDragging) return;
      state.bagDragging = false;
      carriedBag.classList.remove("dragging");
      updateCarriedBagPosition();
    });

    document.querySelectorAll(".floor-btn").forEach(button => {
      button.addEventListener("click", () => chooseFloor(Number(button.dataset.floor)));
    });

    renderOrders();
    setScene("outside");
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
